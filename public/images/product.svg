<svg width="800" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Градиентный фон -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#86efac;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circle1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dcfce7;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#bbf7d0;stop-opacity:0.5" />
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Декоративные круги -->
  <circle cx="200" cy="200" r="150" fill="url(#circle1)"/>
  <circle cx="600" cy="600" r="180" fill="url(#circle1)"/>
  <circle cx="700" cy="150" r="100" fill="url(#circle1)"/>

  <!-- Иконка листа -->
  <g transform="translate(400, 300)">
    <path d="M -80,-100 Q -80,-150 0,-200 Q 80,-150 80,-100 Q 60,0 0,100 Q -60,0 -80,-100 Z"
          fill="#ffffff" opacity="0.9"/>
    <path d="M 0,-200 L 0,100" stroke="#22c55e" stroke-width="8" opacity="0.7"/>
    <path d="M -40,-80 Q -20,-60 0,-40" stroke="#22c55e" stroke-width="6" fill="none" opacity="0.6"/>
    <path d="M 40,-80 Q 20,-60 0,-40" stroke="#22c55e" stroke-width="6" fill="none" opacity="0.6"/>
  </g>

  <!-- Текст -->
  <text x="400" y="550" font-family="Arial, sans-serif" font-size="48" font-weight="bold"
        fill="#ffffff" text-anchor="middle">Нежная кожа</text>
  <text x="400" y="600" font-family="Arial, sans-serif" font-size="28"
        fill="#f0fdf4" text-anchor="middle" opacity="0.9">Натуральное средство</text>
</svg>
